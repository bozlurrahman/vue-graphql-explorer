# Publishes to npm when a v* tag is pushed (EXP-10). Nobody publishes from a laptop: `prepublishOnly` refuses
# outside this workflow.
#
# Setup, once:
# - npm: a granular access token with publish rights on `vue-graphql-explorer` only (account `bozlur`, 2FA on).
# - GitHub: Settings > Environments > `npm` (add required reviewers there to approve each release), secret
#   `NPM_TOKEN` in that environment.
#
# Release: update CHANGELOG.md and `version` in package.json (npm version x.y.z --no-git-tag-version), commit,
# then `git tag vx.y.z && git push origin main vx.y.z`. A version with a hyphen (1.0.0-beta.1) goes to the
# `next` dist-tag and becomes a GitHub pre-release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            toolchain/vue2/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix toolchain/vue2

      - name: Tag matches package.json
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build
        run: npm run build

      - name: Package contents
        run: npm run pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_FROM_CI: 'true'
        run: npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          PRERELEASE=""
          if [ "${{ steps.version.outputs.dist_tag }}" = "next" ]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $PRERELEASE
